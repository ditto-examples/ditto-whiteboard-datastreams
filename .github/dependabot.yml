# Dependabot — automated update PRs for Ditto first-party packages only.
# https://docs.github.com/code-security/dependabot
version: 2
multi-ecosystem-groups:
  ditto:
    schedule:
      interval: "weekly"
updates:
  # Android — Gradle (com.ditto: SDK)
  - package-ecosystem: "gradle"
    directory: "/whiteboard"
    multi-ecosystem-group: "ditto"
    patterns:
      - "com.ditto:*"
