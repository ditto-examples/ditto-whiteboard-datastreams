name: Android verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whiteboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify app
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:bundleRelease \
            :app:compileDebugAndroidTestKotlin \
            :app:validateDebugScreenshotTest

      - name: Verify 16 KB native LOAD alignment
        run: python3 ../tools/verify_elf_alignment.py app/build/outputs/bundle/release/app-release.aab
