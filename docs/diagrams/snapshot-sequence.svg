<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M1,1 L11,5 L1,9" fill="#2E7D32"/>
    </marker>
    <marker id="l" markerWidth="12" markerHeight="12" refX="2" refY="5" orient="auto">
      <path d="M11,1 L1,5 L11,9" fill="#0057B8"/>
    </marker>
  </defs>
  <rect width="1040" height="720" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1b2226">Late-join snapshot hydration (over wb_state, Reliable)</text>
  <text x="30" y="64" font-size="14" fill="#5b6770">How a peer that joins an existing board catches up — merge-only, digest-verified, buffered, with a timeout retry.</text>

  <!-- lifelines -->
  <rect x="150" y="92" width="230" height="46" rx="10" fill="#eef4fb" stroke="#0057B8" stroke-width="1.5"/>
  <text x="265" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#0057B8">Late Joiner</text>
  <text x="265" y="131" font-size="10.5" text-anchor="middle" fill="#5b6770">empty board, just connected</text>
  <rect x="660" y="92" width="230" height="46" rx="10" fill="#eafaf3" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="775" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#2E7D32">Existing Peer</text>
  <text x="775" y="131" font-size="10.5" text-anchor="middle" fill="#5b6770">holds board state + op log</text>
  <line x1="265" y1="138" x2="265" y2="660" stroke="#0057B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="775" y1="138" x2="775" y2="660" stroke="#2E7D32" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 1 Hello -->
  <text x="270" y="176" font-size="11" fill="#8a969d">after both streams open…</text>
  <line x1="265" y1="188" x2="773" y2="188" stroke="#0057B8" stroke-width="1.8" marker-end="url(#r)" opacity="0.85"/>
  <rect x="360" y="168" width="320" height="20" rx="6" fill="#ffffff"/>
  <text x="520" y="183" font-size="12.5" text-anchor="middle" fill="#0057B8" font-weight="600">Hello(highWaterMarks, profile, ready)</text>

  <!-- decision -->
  <rect x="600" y="204" width="350" height="52" rx="9" fill="#fff6e9" stroke="#E08600" stroke-width="1.2"/>
  <text x="775" y="224" font-size="11.5" text-anchor="middle" fill="#B36A00" font-weight="600">compareStateVectors(local, remote)</text>
  <text x="775" y="242" font-size="10.5" text-anchor="middle" fill="#5b6770">LocalDominates or Concurrent + has ops → send snapshot</text>

  <!-- 2 SnapshotBegin -->
  <line x1="775" y1="284" x2="267" y2="284" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#l)"/>
  <rect x="330" y="264" width="380" height="20" rx="6" fill="#ffffff"/>
  <text x="520" y="279" font-size="12.5" text-anchor="middle" fill="#2E7D32" font-weight="600">SnapshotBegin(transferId, chunkCount, byteCount, sha256)</text>
  <text x="265" y="308" font-size="10.5" text-anchor="middle" fill="#5b6770">start hydration · start 10 s timeout</text>

  <!-- 3 SnapshotChunk xN -->
  <line x1="775" y1="336" x2="267" y2="336" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#l)"/>
  <rect x="360" y="316" width="320" height="20" rx="6" fill="#ffffff"/>
  <text x="520" y="331" font-size="12.5" text-anchor="middle" fill="#2E7D32" font-weight="600">SnapshotChunk(index, data)  × N</text>
  <text x="265" y="356" font-size="10.5" text-anchor="middle" fill="#5b6770">reassemble · update progress</text>

  <!-- buffering note -->
  <rect x="70" y="372" width="390" height="60" rx="9" fill="#f3f6f8" stroke="#c3ccd2" stroke-width="1.1"/>
  <text x="88" y="393" font-size="11" font-weight="700" fill="#3a444b">While hydrating, the late joiner…</text>
  <text x="88" y="411" font-size="10.5" fill="#5b6770">• buffers any new reliable ops from this peer</text>
  <text x="88" y="426" font-size="10.5" fill="#5b6770">• suppresses this peer's live previews</text>

  <!-- 4 SnapshotEnd -->
  <line x1="775" y1="470" x2="267" y2="470" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#l)"/>
  <rect x="400" y="450" width="240" height="20" rx="6" fill="#ffffff"/>
  <text x="520" y="465" font-size="12.5" text-anchor="middle" fill="#2E7D32" font-weight="600">SnapshotEnd(transferId)</text>

  <!-- verify -->
  <rect x="90" y="486" width="350" height="66" rx="9" fill="#eef4fb" stroke="#0057B8" stroke-width="1.2"/>
  <text x="265" y="507" font-size="11.5" text-anchor="middle" fill="#0057B8" font-weight="600">assembler.finish()</text>
  <text x="265" y="525" font-size="10.5" text-anchor="middle" fill="#5b6770">verify SHA-256 + byte count · cancel timeout</text>
  <text x="265" y="541" font-size="10.5" text-anchor="middle" fill="#5b6770">merge(snapshot ∪ buffered ops) — merge-only</text>

  <!-- 5 Ack -->
  <line x1="265" y1="588" x2="773" y2="588" stroke="#0057B8" stroke-width="1.8" marker-end="url(#r)" opacity="0.85"/>
  <rect x="360" y="568" width="320" height="20" rx="6" fill="#ffffff"/>
  <text x="520" y="583" font-size="12.5" text-anchor="middle" fill="#0057B8" font-weight="600">SnapshotAck(accepted = true)</text>

  <!-- timeout box -->
  <rect x="70" y="618" width="900" height="60" rx="10" fill="#fdecea" stroke="#C62828" stroke-width="1.2"/>
  <text x="88" y="640" font-size="12.5" font-weight="700" fill="#C62828">Timeout / failure path</text>
  <text x="88" y="660" font-size="11.5" fill="#1b2226">No SnapshotEnd within 10 s, or SHA-256 mismatch → drop hydration, mark "Timed out"/"Rejected", re-send Hello to retry. Ops are idempotent, so a re-run is safe.</text>
</svg>
