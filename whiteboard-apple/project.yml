name: Whiteboard
options:
  bundleIdPrefix: com.ditto.whiteboard
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Anvil:
    path: ../anvil/swift/Anvil
  WhiteboardCore:
    path: Packages/WhiteboardCore
  WhiteboardKit:
    path: Packages/WhiteboardKit
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.28.0
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Whiteboard:
    type: application
    platform: auto
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Whiteboard
        excludes:
          - "Generated/.gitkeep"
    dependencies:
      - package: Anvil
        product: Anvil
      - package: WhiteboardCore
        product: WhiteboardCore
      - package: WhiteboardKit
        product: WhiteboardKit
      - package: SwiftProtobuf
        product: SwiftProtobuf
      - framework: Frameworks/DittoSwift.xcframework
        embed: true
    preBuildScripts:
      - name: Generate Ditto Credentials
        script: "${SRCROOT}/scripts/generate_credentials.sh"
        alwaysRun: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ditto.whiteboard.apple
        PRODUCT_NAME: Whiteboard
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SDKROOT: auto
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3T2VMFZPPQ
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
        # Keep the app code in the executable. The Xcode 26 Debug dylib launcher does not
        # resolve embedded third-party frameworks when this simulator app starts.
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_TESTABILITY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Ditto Whiteboard"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Whiteboard uses the local network to sync your board with nearby devices."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Whiteboard uses Bluetooth to sync your board with nearby devices."
        INFOPLIST_KEY_NSBonjourServices: "_http-alt._tcp. _http-alt._udp."
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "-"
        # Physical iOS devices require real signing; the "-" identity is for macOS/simulator only.
  WhiteboardTests:
    type: bundle.unit-test
    platform: auto
    sources:
      - path: WhiteboardTests
    dependencies:
      - target: Whiteboard
      - package: WhiteboardCore
        product: WhiteboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ditto.whiteboard.apple.tests
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Whiteboard.app/Contents/MacOS/Whiteboard"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  WhiteboardUITests:
    type: bundle.ui-testing
    platform: auto
    sources:
      - path: WhiteboardUITests
    dependencies:
      - target: Whiteboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ditto.whiteboard.apple.uitests
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Whiteboard:
    build:
      targets:
        Whiteboard: all
        WhiteboardTests: [test]
        WhiteboardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhiteboardTests
        - WhiteboardUITests
  WhiteboardTests:
    build:
      targets:
        Whiteboard: [build]
        WhiteboardTests: [test]
    test:
      config: Debug
      targets:
        - WhiteboardTests
